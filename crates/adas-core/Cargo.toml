[package]
name = "adas-core"
version = "0.1.0"
description = "The ADAS core process: connects to an adapter and runs one step per host frame (D23)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adapter-api = { path = "../adapter-api" }
control = { path = "../control" }
record = { path = "../record" }
sensors = { path = "../sensors" }
fusion = { path = "../fusion" }
features = { path = "../features" }

[[bin]]
name = "adas-core"
path = "src/main.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
