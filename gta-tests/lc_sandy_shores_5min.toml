# Phase 3 gate run: 5 minutes of the autopilot on the Sandy Shores road at
# 80 km/h (about 6 km), hands off: lane-centre offset RMS and takeovers per
# 10 km. (A two-lane country road, one lane each way, bends and junctions.)
# GTA's traffic pulls out and turns across the road at the junctions: after
# an AEB stop the driver re-engages, and each AEB event is listed to review
# (the Phase 3 gate allows at most one false activation per 30 min).
name = "Lane centering: 5 minutes on the Sandy Shores road"
spot = "Sandy Shores road"
feature = "autopilot"
resume_after_aeb = true
steps = [
  "engage",
  "set 80",
  "wait speed>=50 25",
  "sleep 300",
]

[pass]
max_aeb = 1
max_lane_rms = 0.3
min_centering = 0.9
max_takeovers = 1
min_engaged = 0.95
