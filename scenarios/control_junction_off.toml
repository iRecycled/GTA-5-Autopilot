# Control run for junction_pull_out: the same runs with junction AEB
# switched off must all collide, which shows that scenario needs it.
name = "Control: junction AEB off, a car pulling out hits the car"
feature = "none"
duration = 12.0
disabled = ["junction"]

[ego]
speed_kph = 40

[[actor]]
s = 29
d = 20
heading = -90
speed_kph = 30

[repeat]
count = 10
vary_s = 2
vary_d = 3

[pass]
no_collision = false
collision = true
