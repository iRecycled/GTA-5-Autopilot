# Control run for rcta_crossing_from_right: the same runs with RCTA switched
# off must all collide, which shows that scenario needs RCTA. (The setup
# is identical; see that file.)
name = "Control: RCTA off, reversing into crossing traffic ends in a collision"
feature = "none"
duration = 12.0
disabled = ["rcta"]

[ego]
speed_kph = 6
gear = "reverse"

[[actor]]
s = -8.5
d = -20
heading = 90
speed_kph = 15

# The neighbours either side.
[[actor]]
s = 0
d = 2.8
speed_kph = 0
[[actor]]
s = 0
d = -2.8
speed_kph = 0

[repeat]
count = 10
vary_s = 2
vary_d = 8

[pass]
no_collision = false
collision = true
