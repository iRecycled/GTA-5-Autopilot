# Junction AEB from the right, slower and closer: at 30 km/h, a car pulls
# out from a side road on the right at 20 km/h, 12 m from the path.
name = "Junction AEB: a car pulls out from the right at 30 km/h"
feature = "none"
duration = 12.0

[ego]
